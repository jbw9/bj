<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="count">
    <div id="running">0</div>
    <div class="sub">
      <span>True <b id="true">0.0</b></span>
      <span>Cards <b id="seen">0</b></span>
      <label>Decks <select id="decks">
        <option>1</option><option>2</option><option>4</option><option>5</option>
        <option selected>6</option><option>8</option>
      </select></label>
    </div>
    <div id="last" class="last"></div>
  </section>

  <section class="pad" id="pad">
    <button data-r="1">A</button><button data-r="2">2</button><button data-r="3">3</button>
    <button data-r="4">4</button><button data-r="5">5</button><button data-r="6">6</button>
    <button data-r="7">7</button><button data-r="8">8</button><button data-r="9">9</button>
    <button data-r="10" class="wide">10 · J · Q · K</button>
  </section>

  <section class="actions">
    <button id="undo">Undo</button>
    <button id="mic">🎤 Voice</button>
    <button id="reset">New shoe</button>
  </section>
  <p id="hint" class="hint">Keys: 1–9 · 0 = ten · A = ace · ⌫ undo · N new shoe · V voice</p>
</main>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
